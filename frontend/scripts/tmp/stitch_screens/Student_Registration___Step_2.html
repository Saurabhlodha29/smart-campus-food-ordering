<!-- Atmosphere/Micro-interactions Script -->
<script>
        function selectItem(element) {
            // Remove selection from all items
            const allItems = element.parentElement.children;
            for (let item of allItems) {
                item.classList.remove('border-primary-container');
                item.classList.add('border-transparent');
                item.classList.add('card-glow');
                const icon = item.querySelector('.material-symbols-outlined:last-child');
                if (icon) {
                    icon.classList.add('opacity-0');
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            }
            
            // Add selection to clicked item
            element.classList.add('border-primary-container');
            element.classList.remove('border-transparent');
            element.classList.remove('card-glow');
            const activeIcon = element.querySelector('.material-symbols-outlined:last-child');
            if (activeIcon) {
                activeIcon.classList.remove('opacity-0');
                activeIcon.style.fontVariationSettings = "'FILL' 1";
            }
        }

        // Simple typing simulation for visual flair on load
        window.addEventListener('DOMContentLoaded', () => {

        });
    </script>
