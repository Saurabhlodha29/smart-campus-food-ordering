<style>
        @keyframes pulse-dots {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .dot-1 { animation: pulse-dots 1.5s infinite 0s; }
        .dot-2 { animation: pulse-dots 1.5s infinite 0.2s; }
        .dot-3 { animation: pulse-dots 1.5s infinite 0.4s; }

        .app-icon-gradient {
            background: linear-gradient(135deg, #FF6500 0%, #CC5200 100%);
        }
        
        .glow-bg {
            background: radial-gradient(circle, rgba(255, 101, 0, 0.08) 0%, rgba(255, 101, 0, 0) 70%);
            width: 300px;
            height: 300px;
        }

        /* Material symbol weight override */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md overflow-hidden flex flex-col items-center justify-center min-h-screen selection:bg-primary-container/30">
<!-- Radial Glow Background Decor -->
<div class="absolute glow-bg pointer-events-none -z-10 blur-3xl"></div>
<!-- Main Content Cluster -->
<main class="flex flex-col items-center text-center">
<!-- App Icon -->
<div class="w-24 h-24 rounded-3xl app-icon-gradient flex items-center justify-center shadow-2xl mb-8 relative group active:scale-95 transition-transform duration-300">
<!-- Inner border glow for premium feel -->
<div class="absolute inset-0 rounded-3xl border border-white/10 pointer-events-none"></div>
<span class="material-symbols-outlined text-[48px] text-white" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<!-- App Name & Headline -->
<div class="flex flex-col items-center">
<h1 class="font-poppins font-extrabold text-[36px] leading-[44px] tracking-tight">
<span class="text-white">Smart Campus</span>
<span class="text-primary-container">Food</span>
</h1>
<!-- Subtext -->
<p class="mt-4 font-poppins font-normal text-[15px] text-[#C8A87E] tracking-wide opacity-90">
                Order smarter. Eat better.
            </p>
</div>
</main>
<!-- Bottom Section -->
<footer class="fixed bottom-10 w-full flex flex-col items-center gap-6">
<!-- Loading Indicator -->
<div class="flex items-center gap-[6px]">
<div class="w-2 h-2 rounded-full bg-[#FF6500] dot-1"></div>
<div class="w-2 h-2 rounded-full bg-[#CC5200] opacity-60 dot-2"></div>
<div class="w-2 h-2 rounded-full bg-[#CC5200] opacity-30 dot-3"></div>
</div>
<!-- Footer Branding -->
<p class="font-poppins font-normal text-[11px] text-muted-text tracking-widest uppercase">
            Smart Campus Technologies
        </p>
</footer>
<!-- Interactive Layer for Splash Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple subtle parallax or entry animation if needed
            const mainContent = document.querySelector('main');
            mainContent.style.opacity = '0';
            mainContent.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                mainContent.style.transition = 'all 1s cubic-bezier(0.16, 1, 0.3, 1)';
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
