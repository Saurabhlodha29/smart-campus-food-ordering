<canvas id="shader-canvas-ANIMATION_18" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_18');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    float time = u_time * 0.5;
    
    // Create a smooth, organic flow
    vec2 p = uv * 2.0 - 1.0;
    p.x *= u_resolution.x / u_resolution.y;
    
    float wave = sin(p.x * 2.0 + time) * cos(p.y * 2.0 + time);
    wave += sin(p.y * 3.0 - time * 1.5) * cos(p.x * 1.5 + time);
    
    // Brand colors: #FF6500 (orange) and #1C1108 (dark surface)
    vec3 colorA = vec3(1.0, 0.396, 0.0); // #FF6500
    vec3 colorB = vec3(0.11, 0.067, 0.031); // #1C1108
    
    float mask = smoothstep(-0.5, 0.5, wave);
    vec3 finalColor = mix(colorB, colorA * 0.15, mask);
    
    // Add a slight "glint" or pulse
    float pulse = sin(u_time) * 0.5 + 0.5;
    finalColor += colorA * pulse * 0.05 * (1.0 - length(p * 0.5));
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create a premium "Order Pulse" ring
const geometry = new THREE.TorusGeometry(1, 0.02, 16, 100);
const material = new THREE.MeshPhongMaterial({ 
    color: 0xFF6500,
    emissive: 0xFF6500,
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.8
});

const rings = [];
for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(geometry, material.clone());
    ring.scale.set(0.1, 0.1, 0.1);
    scene.add(ring);
    rings.push(ring);
}

const light = new THREE.PointLight(0xFF6500, 1, 10);
light.position.set(2, 2, 2);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 3;

function animate() {
    requestAnimationFrame(animate);
    const time = Date.now() * 0.001;
    
    rings.forEach((ring, i) => {
        const offset = i * (Math.PI * 2 / 3);
        const progress = (time + offset) % 3;
        const scale = progress * 1.5;
        ring.scale.set(scale, scale, scale);
        ring.material.opacity = 1.0 - (progress / 3);
        ring.rotation.x = time * 0.5;
        ring.rotation.y = time * 0.2;
    });
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();
})();
</script>

<!-- Custom Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cancelButton = document.querySelector('button');
            cancelButton.addEventListener('click', (e) => {
                // Subtle haptic-like visual feedback
                cancelButton.classList.add('scale-90');
                setTimeout(() => {
                    cancelButton.classList.remove('scale-90');
                }, 100);
                
                // For demo purposes, we log the action
                console.log('Order cancellation initiated');
            });

            // Dynamic opacity shift for the footer note to create a "breathing" effect
            const footerNote = document.querySelector('p.italic');
            let opacity = 0.8;
            let direction = -0.005;
            
            function animateFooter() {
                opacity += direction;
                if (opacity <= 0.4 || opacity >= 0.8) direction *= -1;
                footerNote.style.opacity = opacity;
                requestAnimationFrame(animateFooter);
            }
            animateFooter();
        });
    </script>
