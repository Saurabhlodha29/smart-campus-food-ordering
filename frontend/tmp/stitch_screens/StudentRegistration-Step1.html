<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account | Smart Campus Food</title>

                "outline-variant": "#5a4136",
                "primary-fixed-dim": "#ffb596",
                "inverse-surface": "#f0e0ca",
                "background": "#0E0801",
                "surface-tint": "#ffb596",
                "on-tertiary": "#003257",
                "muted-text": "#7A6045",
                "tertiary": "#9dcaff",
                "tertiary-container": "#009bfe",
                "card-input": "#2A1A0A",
                "surface-container-lowest": "#140d03",
                "surface-container-highest": "#3d3324",
                "on-primary": "#581e00",

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
      }
      
      body {
        background-color: #0E0801;
        font-family: 'Be Vietnam Pro', sans-serif;
      }

      .input-glow {
        border: 1px solid rgba(255, 101, 0, 0.18);
        transition: all 0.2s ease;
      }

      .input-glow:focus-within {
        border-color: #ff6500;
        background-color: #312111;
      }

      .step-line {
        height: 2px;
        flex: 1;
        background: #2A1A0A;
      }

      .step-line.active {
        background: linear-gradient(90deg, #ff6500 0%, #2A1A0A 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant/20 flex items-center px-margin-mobile h-[64px]">
<div class="flex items-center w-full relative">
<button aria-label="Go back" class="absolute left-0 active:scale-95 transition-transform hover:opacity-80 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center w-full">
<h1 class="font-headline-md text-headline-md text-primary">Create Account</h1>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[390px] pt-[88px] px-margin-mobile flex flex-col pb-32">
<!-- Header Text Section -->
<div class="text-center mb-stack-lg">
<p class="font-body-md text-body-md text-muted-text">Join your campus food community</p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-10 w-full px-4">
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-primary-container text-white flex items-center justify-center font-bold">1</div>
<span class="font-label-md text-label-md text-primary">Details</span>
</div>
<div class="step-line -mt-6"></div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-card-input text-muted-text border border-outline-variant/20 flex items-center justify-center font-bold">2</div>
<span class="font-label-md text-label-md text-muted-text">Campus</span>
</div>
<div class="step-line -mt-6"></div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-card-input text-muted-text border border-outline-variant/20 flex items-center justify-center font-bold">3</div>
<span class="font-label-md text-label-md text-muted-text">Verify</span>
</div>
</div>
<!-- Registration Form (Step 1 Focus) -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-muted-text ml-1">Full Name</label>
<div class="h-[52px] bg-card-input rounded-[12px] input-glow px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-muted-text">person</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md w-full placeholder:text-muted-text/50" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-muted-text ml-1">Email Address</label>
<div class="h-[52px] bg-card-input rounded-[12px] input-glow px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-muted-text">mail</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md w-full placeholder:text-muted-text/50" placeholder="name@campus.ac.in" type="email"/>
</div>
<p class="text-label-sm font-label-sm text-muted-text ml-1 italic">
                    Must match your campus email domain. E.g. name@iit.ac.in
                </p>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-muted-text ml-1">Password</label>
<div class="h-[52px] bg-card-input rounded-[12px] input-glow px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-muted-text">lock</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md w-full placeholder:text-muted-text/50" id="password-field" placeholder="Create password" type="password"/>
<button class="text-muted-text hover:text-primary transition-colors" onclick="togglePassword('password-field')" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-muted-text ml-1">Confirm Password</label>
<div class="h-[52px] bg-card-input rounded-[12px] input-glow px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-muted-text">lock</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md w-full placeholder:text-muted-text/50" placeholder="Re-enter password" type="password"/>
</div>
</div>
<!-- CTA Button -->
<button class="mt-stack-lg h-[52px] w-full bg-primary-container text-white font-bold rounded-full text-body-lg active:scale-95 transition-transform shadow-lg shadow-primary-container/10">
                Continue
            </button>
</form>
<!-- Terms & Conditions Footer -->
<div class="mt-12 text-center">
<p class="font-label-sm text-label-sm text-muted-text leading-relaxed">
                By creating an account, you agree to our <br/>
<a class="text-primary underline" href="#">Terms of Service</a> and <a class="text-primary underline" href="#">Privacy Policy</a>
</p>
</div>
</main>
<!-- Interactive Scripts -->
<script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = event.currentTarget.querySelector('.material-symbols-outlined');
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "visibility";
            } else {
                input.type = "password";
                icon.innerText = "visibility_off";
            }
        }

        // Simple feedback for continue button
        document.querySelector('button.mt-stack-lg').addEventListener('click', () => {
           // This would normally trigger the next step transition
           console.log("Navigating to step 2...");
        });
    </script>
</body></html>
