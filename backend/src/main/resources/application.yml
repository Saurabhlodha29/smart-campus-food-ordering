superadmin:
  email: ${SUPERADMIN_EMAIL}
  password: ${SUPERADMIN_PASSWORD}
  fullname: ${SUPERADMIN_FULLNAME}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    enabled: ${ML_SERVICE_ENABLED:true}
    timeout-ms: ${ML_SERVICE_TIMEOUT_MS:3000}

# ── Razorpay ──────────────────────────────────────────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  payouts-enabled: ${RAZORPAY_PAYOUTS_ENABLED:false}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:NOT_SET}
  payout-account-number: ${RAZORPAY_PAYOUT_ACCOUNT:NOT_SET}

spring:
  application:
    name: smart-campus-food-ordering

  profiles:
    active: dev

  cache:
    type: redis
    redis:
      time-to-live: 30000ms

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

server:
  port: 8080
  tomcat:
    max-swallow-size: 15MB

otp:
  expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  secret: ${OTP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRY_MS:86400000}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      keepalive-time: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.smartcampus.backend.service.DocumentVerificationService: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      keepalive-time: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
